# Render Blueprint: creates the web app and its PostgreSQL database together.
# In Render: New > Blueprint > pick this repository.
services:
  - type: web
    name: hpcm-crm
    runtime: node
    plan: 0.5c-512mb
    # The real site follows the "live" branch; changes reach it only when Tyler says
    # "push it live" (2026-11-17). New work lands on the test site first.
    branch: live
    buildCommand: npm ci
    # db:setup creates the tables on the first start and does nothing after that.
    startCommand: npm run db:setup && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: hpcm-db
          property: connectionString
      # Render asks for this password when the Blueprint is created. It's needed
      # once, to create the first Admin account; after that everyone has their own.
      - key: APP_PASSWORD
        sync: false
      # QuickBooks (Admin > QuickBooks). Keys from the Intuit developer app.
      - key: QBO_CLIENT_ID
        sync: false
      - key: QBO_CLIENT_SECRET
        sync: false
      # Email through Gmail / Google Workspace (src/mail.js): the address and an App Password.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  # Test copy of the site (Tyler 2026-11-17): its own empty database, no QuickBooks
  # and no email, with an orange TEST banner on every page.
  - type: web
    name: hpcm-crm-test
    runtime: node
    plan: 0.5c-512mb
    branch: claude/crm-web-app-x8xkgk
    buildCommand: npm ci
    startCommand: npm run db:setup && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: hpcm-test-db
          property: connectionString
      - key: APP_PASSWORD
        sync: false
      - key: SITE_LABEL
        value: TEST SITE
      - key: PUBLIC_URL
        value: https://hpcm-crm-test.onrender.com

databases:
  - name: hpcm-test-db
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    databaseName: hpcm
    user: hpcm
  - name: hpcm-db
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    databaseName: hpcm
    user: hpcm
